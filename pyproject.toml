[project]
name = "reference-project"
version = "0.1.0"
description = "The shared reference project facilitators build live during the Show hour."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets the tests import campus_events from the project folder.
pythonpath = ["."]
testpaths = ["tests"]
